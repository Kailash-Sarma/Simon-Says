<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Simon.css" />
    <title>Simon Says</title>
  </head>
  <body>
    <h1>Simon Says Game</h1>
    <h2>High Score: <span id="high-score">0</span></h2>
    <p>Start the Game by pressing a key</p>
    <div class="main">
      <div class="s-main">
        <div class="right btn"id = "right"></div>
        <div class="left btn" id = "left"></div>
      </div>
      <div class="sd-main">
        <div class="rig2 btn" id = "rig2"></div>
        <div class="lef2 btn" id = "lef2"></div>
      </div>
    </div>
    <script src="Simon.js"></script>
  </body>
</html>
